<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다중 채팅방 통합 접속 분석기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>💬 다중 채팅방 통합 접속 분석기</h1>

  <!-- 📌 [섹션 1] 밴드 댓글(캐릭터) 파싱 영역 (상시 노출) -->
  <div class="parser-box" style="background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 24px;">
    <h3 style="margin-bottom: 10px; font-size: 1.1rem; color: #1e293b;">📝 1. 밴드 댓글(캐신란) 덤프 파싱</h3>
    <textarea id="rawInput" rows="5" placeholder="밴드 캐신란/캐변란 댓글 텍스트를 이곳에 붙여넣으세요..." style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;"></textarea>
    <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
      <button class="btn-add" onclick="runParser()">댓글 파싱 실행</button>
      <span id="parseStatus" style="font-size: 0.85rem; color: #10b981; font-weight: bold;"></span>
    </div>

    <!-- 파싱 결과 미리보기 & 이력 타임라인 -->
    <details style="margin-top: 15px;">
      <summary style="cursor: pointer; font-weight: bold; color: #475569;">📜 캐릭터 신청/변경 이력 보기</summary>
      <ul class="info-list" id="charHistoryList" style="margin-top: 10px;"></ul>
    </details>
  </div>

  <!-- 📌 [섹션 2] 채팅방 입력 및 통합 분석 설정 -->
  <div class="control-panel">
    <h3 style="margin-bottom: 10px; font-size: 1.1rem; color: #1e293b;">💬 2. 채팅 내역 입력 및 접속 분석</h3>
    <div class="btn-group">
      <button class="btn-add" onclick="addInputField()">+ 입력란 추가</button>
      
      <label class="btn-folder">
        📂 BAND 폴더 자동 불러오기
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;" onchange="loadBandFolder(event)">
      </label>

      <button class="btn-analyze" onclick="analyzeAll()">전체 통합 분석</button>
    </div>
    <div class="input-settings" style="margin-top: 12px;">
      <label>연속 접속 기준(n): <input type="number" id="consecLoginDays" value="7" min="1">일</label>
      <label>연속 미접속 기준(m): <input type="number" id="consecAbsentDays" value="5" min="1">일</label>
      <label>부재 판정 기준(k): <input type="number" id="absenceThresholdDays" value="14" min="1">일</label>
      <label><input type="checkbox" id="excludeToday" checked> 오늘 날짜 제외</label>
    </div>
  </div>

  <div class="input-grid" id="inputContainer"></div>

  <!-- 📌 [섹션 3] 분석 결과 탭 (분석 버튼 클릭 시 표시) -->
  <div class="tabs-container" id="tabsContainer" style="display:none;">
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab(1)">(1) 타임라인</button>
      <button class="tab-btn" onclick="switchTab(2)">(2) 인원별 접속 날짜</button>
      <button class="tab-btn" onclick="switchTab(3)">(3) 날짜별 접속 인원</button>
      <button class="tab-btn" onclick="switchTab(4)">(4) 연속 접속 인원</button>
      <button class="tab-btn" onclick="switchTab(5)">(5) 연속 미접속 / 부재 인원</button>
    </div>

    <!-- Tab 1 -->
    <div class="tab-content active" id="tabContent_1">
      <div class="legend">
        <span class="legend-item"><span class="color-box" style="background: var(--color-login-normal-bg);"></span> 접속 (O)</span>
        <span class="legend-item"><span class="color-box" style="background: var(--color-login-strong-bg);"></span> n일 이상 연속 접속</span>
        <span class="legend-item"><span class="color-box" style="background: var(--color-absent-m-bg);"></span> m일 이상 연속 미접속</span>
        <span class="legend-item"><span class="color-box" style="background: var(--color-absence-k-bg);"></span> k일 이상 연속 미접속 (부재)</span>
      </div>
      <div class="table-wrapper">
        <table id="timelineTable">
          <thead><tr id="timelineHeader"></tr></thead>
          <tbody id="timelineBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Tab 2 -->
    <div class="tab-content" id="tabContent_2">
      <ul class="info-list" id="userDatesList"></ul>
    </div>

    <!-- Tab 3 -->
    <div class="tab-content" id="tabContent_3">
      <ul class="info-list" id="dateUsersList"></ul>
    </div>

    <!-- Tab 4 -->
    <div class="tab-content" id="tabContent_4">
      <ul class="info-list" id="consecLoginList"></ul>
    </div>

    <!-- Tab 5 -->
    <div class="tab-content" id="tabContent_5">
      <ul class="info-list" id="consecAbsentList"></ul>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
